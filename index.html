<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the env(safe-area-inset-*) rules in index.css resolve on notched
         devices; without it iOS keeps the web content inside the unsafe area and every gutter
         using --workspace-gutter-start/end silently becomes 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#181818" />
    <title>Burnrate</title>
    <script>
      // First paint: paint the saved palette before React mounts so the window never flashes
      // stock colours. appearance.ts writes burnrate.boot = {dark,bg,fg} on every change; the
      // settings mirror supplies the mode and theme id. No network, no imports.
      (function () {
        try {
          var DARK_BG = "#181818";
          var LIGHT_BG = "#fcfcfc";
          var DARK_FG = "#f2f2f2";
          var LIGHT_FG = "#27272a";
          var boot = null;
          var settings = {};
          try { boot = JSON.parse(localStorage.getItem("burnrate.boot") || "null"); } catch (e) {}
          try { settings = JSON.parse(localStorage.getItem("burnrate.settings.mirror") || "{}") || {}; } catch (e) {}
          var appearance = settings.appearance || {};
          // New installs are dark (appearance.themeMode default). Stored "system"/"light" stay honoured.
          var mode = appearance.themeMode === "system" || appearance.themeMode === "light" ? appearance.themeMode : "dark";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var bg = dark ? DARK_BG : LIGHT_BG;
          var fg = dark ? DARK_FG : LIGHT_FG;
          if (boot && typeof boot.dark === "boolean" && typeof boot.bg === "string") {
            dark = boot.dark;
            bg = boot.bg;
            if (typeof boot.fg === "string") fg = boot.fg;
          }
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          root.style.background = bg;
          // Match the variables applyThemePalette() writes so custom themes do not flash the
          // stock palette, and the data-theme-id selectors in index.css apply on frame one.
          root.style.setProperty("--app-theme-canvas", bg);
          root.style.setProperty("--app-theme-text", fg);
          var themeId = dark ? appearance.darkThemeId : appearance.lightThemeId;
          if (typeof themeId === "string" && themeId) root.dataset.themeId = themeId;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
