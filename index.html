<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#181818" />
    <title>Burnrate</title>
    <script>
      // Apply the saved theme before first paint so the window never flashes white.
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem("burnrate.settings") || "{}").theme) || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.background = dark ? "#181818" : "#fafafa";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
